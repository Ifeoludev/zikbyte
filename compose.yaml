services:
  redis:
    image: redis:7-alpine
    container_name: zikbyte-redis
    # Host port 6380 (not the default 6379) so ZikByte's Redis never collides
    # with another project's Redis running on the same machine.
    ports:
      - "6380:6379"
    # --appendonly yes: Redis writes an on-disk log so the queue, job state, and
    # the expiry set survive a container restart (persistence "on").
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
