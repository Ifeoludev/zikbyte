services:
  - type: web
    name: zikbyte-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=@zikbyte/api
    startCommand: npm run start --workspace=@zikbyte/api
    healthCheckPath: /api/health
    envVars:
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Left blank on first deploy — fill in with the zikbyte-web static
      # site's actual assigned URL once it exists, then this service
      # restarts automatically on save.
      - key: CORS_ORIGIN
        sync: false

  - type: worker
    name: zikbyte-worker
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=@zikbyte/worker
    startCommand: npm run start --workspace=@zikbyte/worker
    envVars:
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 2

  - type: web
    name: zikbyte-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=@zikbyte/web
    staticPublishPath: packages/web/dist
    envVars:
      # Left blank on first deploy — fill in with the zikbyte-api web
      # service's actual assigned URL once it exists, then trigger a
      # manual redeploy (static builds bake this in at build time, so a
      # plain env-var save alone doesn't take effect like it does above).
      - key: VITE_API_URL
        sync: false
