services:
  - type: web
    name: zikbyte-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=@zikbyte/api
    startCommand: npm run start --workspace=@zikbyte/api
    healthCheckPath: /api/health
    envVars:
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      # Not a secret — Render's assigned public URL for zikbyte-web, known
      # only after that service's first deploy, hence added here rather
      # than at initial blueprint creation.
      - key: CORS_ORIGIN
        value: https://zikbyte-web.onrender.com

  - type: web
    name: zikbyte-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=@zikbyte/web
    staticPublishPath: packages/web/dist
    envVars:
      # Not a secret — Render's assigned public URL for zikbyte-api, known
      # only after that service's first deploy, hence added here rather
      # than at initial blueprint creation. Static builds bake env vars in
      # at build time, so this alone won't take effect until the next
      # deploy of this service — unlike a plain web service's env var,
      # which applies on save via a restart, no rebuild needed.
      - key: VITE_API_URL
        value: https://zikbyte-api.onrender.com
